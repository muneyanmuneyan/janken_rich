<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <script src="js/jquery-2.1.3.min.js"></script>
    <link rel="stylesheet" href="css/sample.css">
    <title>じゃんけん</title>
</head>

<body>

    <header>
        <h1><img src="./img/title.png" alt="じゃんけん"></h1>
    </header>

    <main>
        <p class="guide">好きな手を選んでね</p>
        <ul>
            <li id="gu_btn"><img src="./img/gu.png" alt="グー"></li>
            <li id="cho_btn"><img src="./img/choki.png"  alt="パー"></li>
            <li id="par_btn"><img src="./img/pa.png"  alt="チョキ"></li>
        </ul>

        <div id="round">1回戦 / 3回戦</div>

        <!-- 戦績カウンター -->
        <div class="score">
            <span class="score_item score_win">勝ち <span id="win_count">0</span></span>
            <span class="score_item score_lose">負け <span id="lose_count">0</span></span>
            <span class="score_item score_draw">あいこ <span id="draw_count">0</span></span>
            <button id="reset_btn">リセット</button>
        </div>

        <!-- 「じゃん・けん・ぽん！」の掛け声 -->
        <div id="call"></div>

        <div class="hands_row">
        <div class="pc_area my_area">
         <span class="pc_label">あなたの手</span>
         <span id="my_hands">❓</span>
        </div>

        <span class="vs">VS</span>

        <div class="pc_area">
         <span class="pc_label">コンピュータの手</span>
         <span id="pc_hands">❓</span>
      </div>
    </div>
        <div id="judgment"></div>
        <div id="final"></div>

    </main>

     <footer></footer>
    
    <script>
      // 表示までの時間
      const HAND_DELAY = 1000;   // コンピュータの手を表示するまで1秒待つ
      const RESULT_DELAY = 2000; // 勝ち・負け・あいこを表示するまで2秒待つ
      const MAX_ROUND = 3; // 3回勝負
      let playing = false; // 表示中はクリックを受け付けない

    // 戦績（勝ち・負け・あいこの回数）
      let winCount = 0;
      let loseCount = 0;
      let drawCount = 0;


    // 掛け声を表示する
    function showCall(text) {
    // アニメーション再生
    $("#call").html('<span class="pop">' + text + '</span>');
}

    // 「じゃん・けん・ぽん！」を順番に表示
    function janken() {
    showCall("じゃん");

    setTimeout(function () {
        showCall("けん");
    }, HAND_DELAY / 2);   // HAND_DELAY の半分の時間で表示

    setTimeout(function () {
        showCall("ぽん！");
    }, HAND_DELAY);       // コンピュータの手と同じタイミングで表示
}

    // 自分の手を「ぽん！」のタイミングで表示する
    function myHand(hand) {
    $("#my_hands").html("❓"); // クリックした瞬間は❓にする

    setTimeout(function () {
        $("#my_hands").html(hand);
    }, HAND_DELAY);
}

    // 1～3の乱数を発生させる
    function pcHand() { 
     const r = Math.ceil(Math.random() * 3); 
     playing = true; // 表示

    // クリックした時に、前回の表示をリセットする
    $("#pc_hands").html("❓");
    $("#judgment").html("");

    janken(); // ← 追加：「じゃん・けん・ぽん！」を開始

    setTimeout(function () {
        if (r === 1) {
            $("#pc_hands").html("✊");
        } else if (r === 2) {
            $("#pc_hands").html("✌️");
        } else if (r === 3) {
            $("#pc_hands").html("🖐");
        }
    }, HAND_DELAY);

    return r; // 判定
}

    // 終わった回数（勝ち＋負け＋あいこ）を返す関数
    function playedCount() {
    return winCount + loseCount + drawCount;
}

    // 規定の回数を終えたかどうかを返す関数（終わっていれば true）
    function isGameOver() {
    return playedCount() >= MAX_ROUND;
}

    // 画面の戦績の数字と、何回戦目かを更新する関数
    function showScore() {
    $("#win_count").text(winCount);
    $("#lose_count").text(loseCount);
    $("#draw_count").text(drawCount);

    if (isGameOver()) {
        $("#round").text("試合終了");
    } else {
        $("#round").text((playedCount() + 1) + "回戦 / " + MAX_ROUND + "回戦");
    }
}

    // 戦績を1つ増やして、画面の数字を更新する関数
    function updateScore(result) {
    if (result === "勝ち") {
        winCount = winCount + 1;
    } else if (result === "負け") {
        loseCount = loseCount + 1;
    } else if (result === "あいこ") {
        drawCount = drawCount + 1;
    }
    showScore(); // 画面の数字を更新
}

    // 規定の回数を終えたときに、最終結果を表示する関数
    function showFinal() {
    let message;
    if (winCount > loseCount) {
        message = "🎉 あなたの優勝！ 🎉";
    } else if (winCount < loseCount) {
        message = "😢 コンピュータの優勝…";
    } else {
        message = "🤝 引き分け";
    }

    $("#final").html(
        '<p class="final_title">' + message + '</p>' +
        '<p class="final_detail">' + winCount + "勝 " + loseCount + "敗 " + drawCount + "分け</p>" +
        '<p class="final_hint">リセットボタンでもう一度遊べます</p>'
    );
}

    // RESULT_DELAY後に勝ち・負け・あいこを画像で表示する
    function showResult(result) {
    setTimeout(function () {
        if (result === "勝ち") {
            $("#judgment").html('<img src="./img/kachi.png" alt="勝ち">');
        } else if (result === "負け") {
            $("#judgment").html('<img src="./img/make.png" alt="負け">');
        } else if (result === "あいこ") {
            $("#judgment").html('<img src="./img/aiko.png" alt="あいこ">');
        }

        $("#call").html("");  // 掛け声を消す
        updateScore(result); // 結果の画像と同時に戦績を更新
        if (isGameOver()) {   //3回終わったら
        showFinal();      // 最終結果を表示
        }
        playing = false; // 表示が終わって次のクリックを受け付け
    }, RESULT_DELAY);
}

    // グーをクリック
    $("#gu_btn").on("click", function () {
    if (playing || isGameOver()) return; // 表示中または試合が終わっていたら無視する
    myHand("✊");        // 自分の手を表示
    const r = pcHand();
    if (r + 1 === 2) {
        showResult("あいこ");
    } else if (r + 1 === 3) {
        showResult("勝ち");
    } else if (r + 1 === 4) {
        showResult("負け");
    }
});

    // チョキをクリック
    $("#cho_btn").on("click", function () {
    if (playing || isGameOver()) return;
    myHand("✌️");
    const r = pcHand();
    if (r + 1 === 2) {
        showResult("負け");
    } else if (r + 1 === 3) {
        showResult("あいこ");
    } else if (r + 1 === 4) {
        showResult("勝ち");
    }
});

    // パーをクリック
    $("#par_btn").on("click", function () {
    if (playing || isGameOver()) return;
    myHand("🖐");
    const r = pcHand();
    if (r + 1 === 2) {
        showResult("勝ち");
    } else if (r + 1 === 3) {
        showResult("負け");
    } else if (r + 1 === 4) {
        showResult("あいこ");
    }
});

    // リセットボタンをクリック
    $("#reset_btn").on("click", function () {
    if (playing) return; // 結果の表示中はリセットできないようにする

    // 戦績を0に戻す
    winCount = 0;
    loseCount = 0;
    drawCount = 0;
    showScore();

    // 手と結果の表示を最初の状態に戻す
    $("#my_hands").html("❓");
    $("#pc_hands").html("❓");
    $("#judgment").html("");
    $("#call").html("");
    $("#final").html("");   //最終結果を消す
});
    </script>
</body>

</html>
